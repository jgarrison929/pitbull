# Railway config for the v5 app on the staging `pitbull-web` service.
# Service settings: Root Directory `/v5`, Config File Path `/v5/railway.toml`
# (Railway does not look for config inside the root directory on its own,
# and the repo-root railway.toml forces the legacy Dockerfile builder).
# Railpack detects npm and Node 24 from package.json and package-lock.json.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"
watchPatterns = ["/v5/**"]

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 60
