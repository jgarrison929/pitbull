name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

# PRs: a new push cancels the stale run. Other events get a unique group so no main run is ever
# cancelled or dropped from the queue (release.yml requires a successful CI run per main SHA).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.402'
  NODE_VERSION: '24.21.0'
  # Lucky Penny community license - suppresses MediatR license warnings in CI tests.
  # Repo secret: Settings -> Secrets -> MEDIATR_LICENSE_KEY (JWT from luckypennysoftware.com/community)
  MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY }}

jobs:
  # PR path routing (pushes to main always run everything; ci-gate still reports either way):
  #   legacy: any file outside v5/ -> .NET build + unit tests (docs tests live there)
  #   code:   legacy code beyond docs/*.md/LICENSE -> integration tests, legacy frontend, smokes
  #   v5:     v5/** or this workflow -> v5 job
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      legacy: ${{ steps.filter.outputs.legacy }}
      code: ${{ steps.filter.outputs.code }}
      v5: ${{ steps.filter.outputs.v5 }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            { echo "legacy=true"; echo "code=true"; echo "v5=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if grep -qvE '^v5/' <<<"$files"; then legacy=true; else legacy=false; fi
          if grep -qvE '^v5/|^docs/|\.md$|^LICENSE$' <<<"$files"; then code=true; else code=false; fi
          if grep -qE '^v5/|^\.github/workflows/ci\.yml$' <<<"$files"; then v5=true; else v5=false; fi
          { echo "legacy=$legacy"; echo "code=$code"; echo "v5=$v5"; } >> "$GITHUB_OUTPUT"
          {
            echo "Legacy files changed: **$legacy** (false = .NET build and unit tests skipped)"
            echo "Legacy code changed: **$code** (false = integration tests, legacy frontend and smokes skipped)"
            echo "v5 changed: **$v5**"
          } >> "$GITHUB_STEP_SUMMARY"

  build-backend:
    name: Build & Test (.NET)
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pitbull
          POSTGRES_PASSWORD: pitbull_dev
          POSTGRES_DB: pitbull_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        # packages.lock.json + RestorePackagesWithLockFile — fail on drift
        run: dotnet restore --locked-mode

      - name: Scan for vulnerable packages
        run: |
          echo "::group::NuGet Vulnerability Scan"
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-scan.txt
          if grep -q "has the following vulnerable packages" vulnerability-scan.txt; then
            echo "::error::Vulnerable NuGet packages detected!"
            echo "::group::Vulnerable packages found"
            grep -A 20 "has the following vulnerable packages" vulnerability-scan.txt
            echo "::endgroup::"
            exit 1
          else
            echo "âœ… No vulnerable packages detected"
          fi
          echo "::endgroup::"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check migrations for dangerous patterns
        run: |
          echo "::group::Migration Safety Check"
          DANGEROUS_PATTERNS=0
          
          # Check for RenameColumn or RenameTable (dangerous in production - can break queries)
          if grep -rE "(RenameColumn|RenameTable)" src/Pitbull.Api/Migrations/*.cs 2>/dev/null; then
            echo "::error::RenameColumn/RenameTable detected - this can break production queries!"
            DANGEROUS_PATTERNS=1
          fi
          
          # Check for Sql() with DROP TABLE/TRUNCATE (destructive to data)
          # Excludes safe operations: DROP POLICY, DROP INDEX, DROP CONSTRAINT (RLS/schema management)
          if grep -rE 'Sql\s*\(\s*"[^"]*\b(DROP|TRUNCATE)\b' src/Pitbull.Api/Migrations/*.cs 2>/dev/null \
             | grep -vE 'DROP (POLICY|INDEX|CONSTRAINT)' ; then
            echo "::error::Manual DROP/TRUNCATE SQL detected - review carefully!"
            DANGEROUS_PATTERNS=1
          fi
          
          if [ $DANGEROUS_PATTERNS -eq 1 ]; then
            echo "::error::Dangerous migration patterns detected. Review carefully before merging."
            exit 1
          else
            echo "âœ… No dangerous migration patterns detected"
          fi
          echo "::endgroup::"

      - name: Run Unit Tests
        run: dotnet test tests/Pitbull.Tests.Unit --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults

      - name: Run Integration Tests
        if: needs.changes.outputs.code == 'true'
        run: dotnet test tests/Pitbull.Tests.Integration --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults
        env:
          ConnectionStrings__PitbullDb: "Host=localhost;Port=5432;Database=pitbull_test;Username=pitbull;Password=pitbull_dev"

      - name: Summarize failed tests
        if: failure()
        run: |
          failed=$(grep -rhoP '<UnitTestResult [^>]*testName="\K[^"]+(?="[^>]*outcome="Failed")' TestResults 2>/dev/null || true)
          {
            echo "### Failed .NET tests"
            if [ -n "$failed" ]; then sed 's/^/- /' <<<"$failed"; else echo "None recorded; the failure is in a non-test step."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    name: Build Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Pitbull.Web/pitbull-web/package-lock.json

      - name: Install dependencies
        working-directory: src/Pitbull.Web/pitbull-web
        run: npm ci

      - name: Audit npm packages for vulnerabilities
        working-directory: src/Pitbull.Web/pitbull-web
        run: |
          echo "::group::npm Vulnerability Audit"
          # Only audit production dependencies (omit dev-only tooling like eslint)
          # Dev dependency vulnerabilities (e.g. eslint/minimatch ReDoS) don't affect the built app
          if npm audit --audit-level high --omit=dev; then
            echo "âœ… No high+ production vulnerabilities detected"
          else
            echo "::error::npm audit found high+ vulnerabilities in production dependencies!"
            echo "Run 'npm audit fix' to address auto-fixable issues"
            exit 1
          fi
          echo "::endgroup::"

      - name: Build
        working-directory: src/Pitbull.Web/pitbull-web
        run: npm run build

      - name: Lint
        working-directory: src/Pitbull.Web/pitbull-web
        run: npm run lint

  mobile-smoke:
    name: Mobile field report smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pitbull
          POSTGRES_PASSWORD: pitbull_dev
          POSTGRES_DB: pitbull_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__PitbullDb: "Host=localhost;Port=5432;Database=pitbull_test;Username=pitbull;Password=pitbull_dev"
      Demo__Enabled: "true"
      Demo__SeedOnStartup: "true"
      API_BASE_URL: http://localhost:5081
      DEMO_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5081

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            e2e/package-lock.json
            src/Pitbull.Web/pitbull-web/package-lock.json

      - name: Build API
        run: dotnet build --configuration Release src/Pitbull.Api/Pitbull.Api.csproj

      - name: Install frontend dependencies
        working-directory: src/Pitbull.Web/pitbull-web
        run: npm ci

      - name: Build frontend
        working-directory: src/Pitbull.Web/pitbull-web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5081
        run: npm run build

      - name: Install e2e dependencies + Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start API (Development + demo seed)
        run: |
          dotnet run --project src/Pitbull.Api/Pitbull.Api.csproj \
            --configuration Release --no-build \
            --urls http://localhost:5081 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5081/health/live; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API failed to start"
          exit 1

      - name: Start frontend
        working-directory: src/Pitbull.Web/pitbull-web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5081
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend failed to start"
          exit 1

      - name: Auth setup (role storage states)
        working-directory: e2e
        run: npx playwright test --project=setup-roles

      - name: Run mobile-field-report project
        working-directory: e2e
        run: npx playwright test --project=mobile-field-report --reporter=list,github

      - name: Upload mobile-smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-smoke-artifacts
          path: |
            e2e/recordings/**
            e2e/test-results/**
          if-no-files-found: ignore

  owner-signup-smoke:
    name: Owner signup smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pitbull
          POSTGRES_PASSWORD: pitbull_dev
          POSTGRES_DB: pitbull_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__PitbullDb: "Host=localhost;Port=5432;Database=pitbull_test;Username=pitbull;Password=pitbull_dev"
      Demo__Enabled: "true"
      Demo__SeedOnStartup: "true"
      API_BASE_URL: http://localhost:5081
      DEMO_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5081
      E2E_OUTPUT_DIR: /tmp/pitbull-owner-signup-ci

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            e2e/package-lock.json
            src/Pitbull.Web/pitbull-web/package-lock.json

      - name: Build API
        run: dotnet build --configuration Release src/Pitbull.Api/Pitbull.Api.csproj

      - name: Install frontend dependencies
        working-directory: src/Pitbull.Web/pitbull-web
        run: npm ci

      - name: Build frontend
        working-directory: src/Pitbull.Web/pitbull-web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5081
        run: npm run build

      - name: Install e2e dependencies + Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start API (Development + demo seed)
        run: |
          dotnet run --project src/Pitbull.Api/Pitbull.Api.csproj \
            --configuration Release --no-build \
            --urls http://localhost:5081 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5081/health/live; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API failed to start"
          exit 1

      - name: Start frontend
        working-directory: src/Pitbull.Web/pitbull-web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5081
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend failed to start"
          exit 1

      - name: Run owner-signup project
        working-directory: e2e
        run: npx playwright test --project=owner-signup --reporter=list,github

      - name: Upload owner-signup artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: owner-signup-smoke-artifacts
          path: |
            e2e/recordings/**
            e2e/test-results/**
            /tmp/pitbull-owner-signup-ci/**
          if-no-files-found: ignore

  v5:
    name: v5 (lint, typecheck, test, build, e2e)
    needs: changes
    if: needs.changes.outputs.v5 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v5

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pcs
          POSTGRES_PASSWORD: pcs_ci
          POSTGRES_DB: pcs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pcs:pcs_ci@localhost:5432/pcs_test
      GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: v5/.nvmrc
          cache: 'npm'
          cache-dependency-path: v5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        env:
          EXPECT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export EXPECT_COMMIT="${EXPECT_COMMIT:0:12}"
          npm run e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v5-playwright
          path: |
            v5/test-results/**
            v5/playwright-report/**
          if-no-files-found: ignore

  # The only required check on main. Add new required jobs to `needs`; the check name stays ci-gate.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, build-backend, build-frontend, mobile-smoke, owner-signup-smoke, v5]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ci-gate"
            echo "| job | result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$NEEDS")
          if [ -z "$bad" ]; then exit 0; fi
          {
            echo "#### Failing steps"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url)): \([.steps[] | select(.conclusion == "failure") | .name] | join(", "))"' || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Required jobs did not pass: $(tr '\n' ' ' <<<"$bad")"
          exit 1
