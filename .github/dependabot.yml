version: 2
# The legacy app (src/, e2e/) is frozen at tag legacy-3.8.2-final, so only v5 and Actions get updates.
updates:
  - package-ecosystem: "npm"
    directory: "/v5"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    ignore:
      # @types/node must match the Node major in v5/.nvmrc and engines; bump it with the runtime, not alone.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
