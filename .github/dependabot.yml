version: 2
# The legacy app (src/, e2e/) is frozen at tag legacy-3.8.2-final, so only v5 and Actions get updates.
updates:
  - package-ecosystem: "npm"
    directory: "/v5"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
