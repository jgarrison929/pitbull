version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    # Microsoft.OpenApi 3.x breaks ASP.NET Core 10 OpenAPI source generators (CS0200 on Example).
    # Keep 2.7.5 pin in Directory.Build.props until Microsoft.AspNetCore.OpenApi supports 3.x.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
        exclude-patterns:
          - "Microsoft.OpenApi"

  - package-ecosystem: "npm"
    directory: "/src/Pitbull.Web/pitbull-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies", "e2e"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/src/Pitbull.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/src/Pitbull.Web/pitbull-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
