version: 2
# The legacy app (src/, e2e/) is frozen at tag legacy-3.8.2-final, so only v5 and Actions get updates.
updates:
  - package-ecosystem: "npm"
    directory: "/v5"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    # react-dom pins an exact react peer, so a solo bump of either fails npm ci.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
